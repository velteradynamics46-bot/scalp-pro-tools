<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Scap pro Tools PAC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: #0d0d0d; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; color: #ffffff; padding: 20px 0;
        }
        .login-card {
            background-color: #1a1a1a; width: 100%; max-width: 400px;
            padding: 40px 30px; border-radius: 12px; border: 1px solid #2a2a2a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .title-brand { font-size: 24px; font-weight: 700; color: #00bfa5; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: #888888; margin-bottom: 25px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #aaaaaa; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px; font-size: 14px; background-color: #edf2f7;
            border: 1px solid #ccc; border-radius: 6px; color: #333333; outline: none; transition: all 0.3s ease;
        }
        .form-group input:focus { border-color: #00bfa5; box-shadow: 0 0 5px rgba(0, 191, 165, 0.3); }
        .btn-login {
            width: 100%; background-color: #00bfa5; color: #0c0d0d; border: none;
            padding: 12px; font-size: 15px; font-weight: 600; border-radius: 6px;
            cursor: pointer; margin-top: 10px; transition: background-color 0.2s ease;
        }
        .btn-login:hover { background-color: #009688; }
        .footer-text { text-align: center; font-size: 12px; color: #888888; margin-top: 25px; }
        .footer-text a { color: #00bfa5; text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
        .alert-error {
            background-color: rgba(255, 82, 82, 0.15); color: #ff5252;
            padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px;
            display: none; border: 1px solid #ff5252;
        }
        .alert-success {
            background-color: rgba(0, 191, 165, 0.15); color: #00bfa5;
            padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px;
            display: none; border: 1px solid #00bfa5;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="title-brand">Scap pro Tools PAC</h1>
        <p class="subtitle">Daftar Akun Baru</p>

        <div id="error-msg" class="alert-error"></div>
        <div id="success-msg" class="alert-success"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email Anda" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Buat password baru" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Konfirmasi Password</label>
                <input type="password" id="confirm-password" placeholder="Ulangi password Anda" required>
            </div>

            <button type="submit" class="btn-login">Daftar Sekarang</button>
        </form>

        <p class="footer-text">Sudah punya akun? <a href="index.html">Login di sini</a></p>
    </div>

    <script>
        //--- Helper penyimpanan (multi-akun + tahan data korup)
        function safeParse(raw, fallback) { try { const v = JSON.parse(raw); return v == null ? fallback : v; } catch (e) { return fallback; } }
        function normEmail(e) { return String(e || '').trim().toLowerCase(); }
        function getAccounts() {
            const raw = safeParse(localStorage.getItem('akunTerdaftar'), []);
            if (Array.isArray(raw)) return raw;
            if (raw && typeof raw === 'object') return [raw];   // migrasi format lama (1 akun)
            return [];
        }
        function saveAccounts(list) { localStorage.setItem('akunTerdaftar', JSON.stringify(list)); }

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value.trim();
            const email = normEmail(document.getElementById('email').value);
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!nama) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Nama lengkap wajib diisi.';
                return;
            }
            if (password.length < 6) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Password minimal 6 karakter.';
                return;
            }
            if (password !== confirmPassword) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Password dan Konfirmasi Password tidak cocok!';
                return;
            }
            const list = getAccounts();
            if (list.some(a => normEmail(a.email) === email)) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Email sudah terdaftar. Silakan login atau gunakan email lain.';
                return;
            }

            // Simpan sebagai daftar akun (tidak menimpa pembeli lain)
            list.push({ nama: nama, email: email, password: password });
            saveAccounts(list);

            successMsg.style.display = 'block';
            successMsg.innerText = 'Pendaftaran berhasil! Mengalihkan ke halaman Login...';
            setTimeout(() => { window.location.href = 'index.html'; }, 1200);
        });
    </script>

</body>
</html>
